[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch"
version = "0.1.0"
description = "A personal job matching and career analysis application."
requires-python = ">=3.10"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.gui-scripts]
jobmatch = "jobmatch.main:main"

[tool.setuptools.packages.find]
where = ["src"]
